<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype 5 - Ripples</title>

    <link rel="stylesheet" href="prototype5-style.css">
</head>

<body>

    <!-- Intro popup -->
    <dialog id="introDialog">
        <p>
            This synthesizer will make some noise, please check your
            system's volume setting. 
        </p>

        <button id="introDialogCloseButton" autofocus>OK</button>
    </dialog>


     <p id="instructions">Click on the planets to give them ripples and play notes! </p>

    <svg id="sky" viewBox="0 0 800 500">

        <!-- gradients give the planets more dimension -->

        <defs>

            <!-- Sun -->
            <radialGradient id="sunGradient" cx="35%" cy="30%">
                <stop offset="0%" stop-color="#fffbd0" />
                <stop offset="40%" stop-color="#ffd83d" />
                <stop offset="75%" stop-color="#f5a900" />
                <stop offset="100%" stop-color="#d66b00" />
            </radialGradient>

            <!-- Mercury -->
            <radialGradient id="mercuryGradient" cx="30%" cy="25%">
                <stop offset="0%" stop-color="#d8d6d2" />
                <stop offset="45%" stop-color="#9e9c98" />
                <stop offset="75%" stop-color="#686662" />
                <stop offset="100%" stop-color="#3f3e3b" />
            </radialGradient>

            <!-- Venus -->
            <radialGradient id="venusGradient" cx="30%" cy="25%">
                <stop offset="0%" stop-color="#fff0c2" />
                <stop offset="45%" stop-color="#e8c27a" />
                <stop offset="75%" stop-color="#c7954e" />
                <stop offset="100%" stop-color="#8a5e2f" />
            </radialGradient>

            <!-- Earth -->
            <radialGradient id="earthGradient" cx="30%" cy="25%">
                <stop offset="0%" stop-color="#8fdcff" />
                <stop offset="40%" stop-color="#328bd0" />
                <stop offset="65%" stop-color="#2168a5" />
                <stop offset="100%" stop-color="#102d5c" />
            </radialGradient>

            <!-- Mars -->
            <radialGradient id="marsGradient" cx="30%" cy="25%">
                <stop offset="0%" stop-color="#ffad80" />
                <stop offset="45%" stop-color="#d96548" />
                <stop offset="75%" stop-color="#a83f32" />
                <stop offset="100%" stop-color="#63251f" />
            </radialGradient>

            <!-- Jupiter -->
            <radialGradient id="jupiterGradient" cx="30%" cy="25%">
                <stop offset="0%" stop-color="#f5d4a3" />
                <stop offset="30%" stop-color="#d9a66f" />
                <stop offset="50%" stop-color="#b9794c" />
                <stop offset="65%" stop-color="#d0a477" />
                <stop offset="80%" stop-color="#9b6343" />
                <stop offset="100%" stop-color="#583827" />
            </radialGradient>

            <!-- Saturn -->
            <radialGradient id="saturnGradient" cx="30%" cy="25%">
                <stop offset="0%" stop-color="#fff0c4" />
                <stop offset="45%" stop-color="#e5cc91" />
                <stop offset="75%" stop-color="#c2a96b" />
                <stop offset="100%" stop-color="#78643e" />
            </radialGradient>

            <!-- Uranus -->
            <radialGradient id="uranusGradient" cx="30%" cy="25%">
                <stop offset="0%" stop-color="#d5ffff" />
                <stop offset="45%" stop-color="#9de5e5" />
                <stop offset="75%" stop-color="#64bfc3" />
                <stop offset="100%" stop-color="#397f87" />
            </radialGradient>

            <!-- Neptune -->
            <radialGradient id="neptuneGradient" cx="30%" cy="25%">
                <stop offset="0%" stop-color="#8ea6ff" />
                <stop offset="40%" stop-color="#4668d6" />
                <stop offset="70%" stop-color="#2947a5" />
                <stop offset="100%" stop-color="#17265f" />
            </radialGradient>

        </defs>


        <!-- SUN -->
        <circle id="sun" cx="10" cy="250" r="105" fill="url(#sunGradient)" />

        <!-- MERCURY -->
        <circle id="mercury" cx="180" cy="370" r="20" fill="url(#mercuryGradient)" />

        <!-- VENUS -->
        <circle id="venus" cx="252" cy="220" r="28" fill="url(#venusGradient)" />

        <!-- EARTH -->
        <circle id="earth" cx="334" cy="310" r="36" fill="url(#earthGradient)" />

        <!-- MARS -->
        <circle id="mars" cx="420" cy="390" r="25" fill="url(#marsGradient)" />

        <!-- JUPITER -->
        <circle id="jupiter" cx="480" cy="240" r="74" fill="url(#jupiterGradient)" />

        <!-- SATURN RINGS -->
        <ellipse id="saturn-ring-outer" cx="580" cy="85" rx="85" ry="23"
            fill="none" stroke="#b9a675" stroke-width="5"
            transform="rotate(-20 580 85)" />

        <ellipse id="saturn-ring-middle" cx="580" cy="85" rx="75" ry="19"
            fill="none" stroke="#dfcd9b" stroke-width="4"
            transform="rotate(-20 580 85)" />

        <ellipse id="saturn-ring-inner" cx="580" cy="85" rx="64" ry="15"
            fill="none" stroke="#9d895e" stroke-width="3"
            transform="rotate(-20 580 85)" />

        <!-- SATURN -->
        <circle id="saturn" cx="580" cy="85" r="55" fill="url(#saturnGradient)" />

        <!-- URANUS -->
        <circle id="uranus" cx="682" cy="360" r="36" fill="url(#uranusGradient)" />

        <!-- NEPTUNE -->
        <circle id="neptune" cx="740" cy="150" r="34" fill="url(#neptuneGradient)" />

    </svg>


    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- Prototype 5 JavaScript -->
    <script src="prototype5-script.js"></script>

</body>
</html>
